{{FrontSide}}
<hr id="answer">
<div class="ac ac-formula-card ac-answer">
  <div class="ac-formula">{{Formula}}</div>
  {{#MeaningOfTerms}}<div class="ac-section"><span class="ac-label">[[label:terms]]</span>{{MeaningOfTerms}}</div>{{/MeaningOfTerms}}
  {{#WhenToUse}}<div class="ac-section ac-why"><span class="ac-label">[[label:when]]</span>{{WhenToUse}}</div>{{/WhenToUse}}
  {{#Example}}<div class="ac-section"><span class="ac-label">[[label:example]]</span>{{Example}}</div>{{/Example}}
  {{#Source}}<div class="ac-source">{{Source}}</div>{{/Source}}
</div>
